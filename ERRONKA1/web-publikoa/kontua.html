<!doctype html>
<html lang="eu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KargaGunea · Nire kontua</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet" />
    <link href="css/estiloak.css" rel="stylesheet" />
  </head>
  <body>
    <header id="goiburu-nabigazioa"></header>

    <div id="jakinarazpenak" class="container mt-4"></div>

    <main class="container my-4 my-lg-5">
      <div class="text-center mb-4">
        <h1 class="h3 mb-1">Nire kontua</h1>
        <p class="text-secondary mb-0">
          Saioa hasi, kontua sortu edo zure datuak aldatu.
        </p>
      </div>

      <!-- Saioa hasi / erregistratu -->
      <div id="saioAtala" class="row justify-content-center d-none">
        <div class="col-12 col-lg-9 col-xl-7">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
              <ul class="nav nav-pills mb-4 gap-2" role="tablist">
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#saioHasiPanela"
                    type="button"
                    role="tab">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Saioa hasi
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#erregistroaPanela"
                    type="button"
                    role="tab">
                    <i class="bi bi-person-plus me-1"></i>Kontua sortu
                  </button>
                </li>
              </ul>

              <div class="tab-content">
                <!-- Saioa hasi -->
                <div class="tab-pane fade show active" id="saioHasiPanela" role="tabpanel">
                  <form id="saioFormularioa" novalidate>
                    <div class="mb-3">
                      <label class="form-label" for="saioEmaila">Emaila</label>
                      <input
                        id="saioEmaila"
                        type="email"
                        class="form-control"
                        autocomplete="email"
                        required />
                    </div>
                    <div class="mb-3">
                      <label class="form-label" for="saioPasahitza">Pasahitza</label>
                      <input
                        id="saioPasahitza"
                        type="password"
                        class="form-control"
                        autocomplete="current-password"
                        required />
                    </div>
                    <div id="saioErrorea" class="alert alert-danger d-none"></div>
                    <button class="btn btn-primary w-100" type="submit" id="saioBotoia">
                      <i class="bi bi-box-arrow-in-right me-1"></i>Saioa hasi
                    </button>
                  </form>
                </div>

                <!-- Erregistroa -->
                <div class="tab-pane fade" id="erregistroaPanela" role="tabpanel">
                  <form id="erregistroFormularioa" novalidate>
                    <div class="row g-3">
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erNan">NAN</label>
                        <input id="erNan" type="text" class="form-control" maxlength="9" required />
                      </div>
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erHelbidea">Helbidea</label>
                        <input id="erHelbidea" type="text" class="form-control" required />
                      </div>
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erIzena">Izena</label>
                        <input id="erIzena" type="text" class="form-control" required />
                      </div>
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erAbizenak">Abizenak</label>
                        <input id="erAbizenak" type="text" class="form-control" required />
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="erEmaila">Emaila</label>
                        <input id="erEmaila" type="email" class="form-control" required />
                      </div>
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erPasahitza">Pasahitza</label>
                        <input
                          id="erPasahitza"
                          type="password"
                          class="form-control"
                          autocomplete="new-password"
                          required />
                        <div class="form-text">Gutxienez 6 karaktere.</div>
                      </div>
                      <div class="col-12 col-md-6">
                        <label class="form-label" for="erPasahitza2">Errepikatu pasahitza</label>
                        <input
                          id="erPasahitza2"
                          type="password"
                          class="form-control"
                          autocomplete="new-password"
                          required />
                      </div>
                    </div>

                    <div id="erregistroErrorea" class="alert alert-danger mt-3 d-none"></div>

                    <button class="btn btn-primary w-100 mt-3" type="submit" id="erregistroBotoia">
                      <i class="bi bi-person-plus me-1"></i>Kontua sortu
                    </button>

                    <p class="small text-secondary mt-3 mb-0">
                      Kontua sortzean erabiltzaile arruntaren rola ematen zaizu automatikoki.
                    </p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Profila -->
      <div id="profilAtala" class="row g-4 d-none">
        <div class="col-12 col-lg-5">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="avatara"><i class="bi bi-person-fill"></i></div>
                <div>
                  <h2 class="h5 mb-0" id="profilIzena"></h2>
                  <span class="text-secondary small" id="profilEmaila"></span>
                </div>
              </div>

              <ul class="list-unstyled small mb-4" id="profilDatuak"></ul>

              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary btn-sm" href="erreserbak.html">
                  <i class="bi bi-calendar-check me-1"></i>Nire erreserbak
                </a>
                <button class="btn btn-outline-danger btn-sm" id="saioaAmaituProfila">
                  <i class="bi bi-box-arrow-right me-1"></i>Saioa amaitu
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">
                <i class="bi bi-pencil-square me-1 text-primary"></i>Nire datuak aldatu
              </h2>

              <form id="profilFormularioa" novalidate>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="prIzena">Izena</label>
                    <input id="prIzena" type="text" class="form-control" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="prAbizenak">Abizenak</label>
                    <input id="prAbizenak" type="text" class="form-control" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="prEmaila">Emaila</label>
                    <input id="prEmaila" type="email" class="form-control" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="prHelbidea">Helbidea</label>
                    <input id="prHelbidea" type="text" class="form-control" required />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="prPasahitza">Pasahitz berria (aukerakoa)</label>
                    <input
                      id="prPasahitza"
                      type="password"
                      class="form-control"
                      autocomplete="new-password" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="prPasahitza2">Errepikatu pasahitza</label>
                    <input
                      id="prPasahitza2"
                      type="password"
                      class="form-control"
                      autocomplete="new-password" />
                  </div>
                </div>

                <div id="profilErrorea" class="alert alert-danger mt-3 d-none"></div>

                <button class="btn btn-primary mt-3" type="submit" id="profilBotoia">
                  <i class="bi bi-check2 me-1"></i>Gorde aldaketak
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="oina mt-5 py-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span><i class="bi bi-lightning-charge-fill me-1"></i>KargaGunea · Udala</span>
        <span class="small">
          <a href="index.html">Kargaguneak</a> ·
          <a href="erreserbak.html">Nire erreserbak</a> ·
          <a href="kontua.html">Nire kontua</a>
        </span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/kontua.js"></script>
  </body>
</html>
